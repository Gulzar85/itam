<div class="form-field">
    <label for="{{ field.id_for_label }}" class="block text-sm font-semibold text-gray-700 mb-2">
        {{ field.label }}
        {% if field.field.required %}<span class="text-red-500">*</span>{% endif %}
    </label>
    
    {{ field }}
    
    {% if field.help_text %}
    <p class="mt-1.5 text-xs text-gray-500 flex items-center gap-1">
        <i data-lucide="info" class="w-3 h-3"></i>
        {{ field.help_text }}
    </p>
    {% endif %}
    
    {% if field.errors %}
    <div class="mt-2 flex items-center gap-2 text-sm text-red-600 bg-red-50 px-3 py-2 rounded-lg">
        <i data-lucide="alert-circle" class="w-4 h-4"></i>
        {% for error in field.errors %}{{ error }}{% endfor %}
    </div>
    {% endif %}
</div>
