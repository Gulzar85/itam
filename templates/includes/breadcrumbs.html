<nav class="flex items-center gap-2 text-sm mb-6" aria-label="Breadcrumb">
    <ol class="flex items-center gap-2">
        <li>
            <a href="{% url 'dashboard' %}" class="text-gray-500 hover:text-gray-700 flex items-center gap-1 transition-colors">
                <i data-lucide="home" class="w-4 h-4"></i>
                <span class="hidden sm:inline">Home</span>
            </a>
        </li>
        {% if breadcrumbs %}
            {% for breadcrumb in breadcrumbs %}
                {% if forloop.last %}
                    <li class="flex items-center gap-2">
                        <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i>
                        <span class="font-semibold text-gray-900">{{ breadcrumb.label }}</span>
                    </li>
                {% else %}
                    <li class="flex items-center gap-2">
                        <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i>
                        <a href="{{ breadcrumb.url }}" class="text-gray-500 hover:text-gray-700 transition-colors">
                            {{ breadcrumb.label }}
                        </a>
                    </li>
                {% endif %}
            {% endfor %}
        {% else %}
            <li class="flex items-center gap-2">
                <i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i>
                <span class="font-semibold text-gray-900">{{ page_title|default:"Dashboard" }}</span>
            </li>
        {% endif %}
    </ol>
</nav>
