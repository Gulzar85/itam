<div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-8 w-full mb-10">
    
    <div class="group relative overflow-hidden glass p-8 min-h-[200px] rounded-[2.5rem] border border-white/50 shadow-xl hover:shadow-2xl transition-all duration-500 hover:-translate-y-2 flex flex-col justify-between">
        <div class="absolute -right-6 -top-6 w-32 h-32 rounded-full blur-3xl group-hover:opacity-80 transition-all duration-700 bg-custom-primary/10 group-hover:bg-custom-primary/20"></div>
        
        <div class="relative z-10">
            <div class="flex items-center justify-between mb-8">
                <div class="shadow-lg p-4 rounded-2xl transform group-hover:rotate-6 transition-transform bg-custom-primary shadow-custom-primary/20">
                    <i data-lucide="layers" class="w-8 h-8 text-white"></i>
                </div>
                <span class="text-[11px] font-black px-3 py-1 rounded-full uppercase tracking-widest bg-custom-primary/10 text-custom-primary">Global Stats</span>
            </div>
            
            <div>
                <p class="text-sm font-bold text-slate-400 uppercase tracking-[0.2em] mb-1">Total Requests</p>
                <h3 class="text-5xl font-black text-slate-800 tracking-tighter">{{ stats.total }}</h3>
            </div>
        </div>
        
        <div class="h-1.5 w-full rounded-full mt-4 overflow-hidden bg-custom-primary/10">
            <div class="h-full w-full opacity-40 bg-custom-primary"></div>
        </div>
    </div>

    <div class="group relative overflow-hidden glass p-8 min-h-[200px] rounded-[2.5rem] border border-white/50 shadow-xl hover:shadow-2xl transition-all duration-500 hover:-translate-y-2 flex flex-col justify-between">
        <div class="absolute -right-6 -top-6 w-32 h-32 bg-amber-500/10 rounded-full blur-3xl group-hover:bg-amber-500/20 transition-all duration-700"></div>
        
        <div class="relative z-10">
            <div class="flex items-center justify-between mb-8">
                <div class="bg-amber-500 shadow-lg shadow-amber-200 p-4 rounded-2xl transform group-hover:-rotate-6 transition-transform">
                    <i data-lucide="clock" class="w-8 h-8 text-white"></i>
                </div>
                <span class="text-[11px] font-black px-3 py-1 rounded-full bg-amber-100 text-amber-700 uppercase tracking-widest">Awaiting Action</span>
            </div>
            
            <div>
                <p class="text-sm font-bold text-slate-400 uppercase tracking-[0.2em] mb-1">Pending Approval</p>
                <h3 class="text-5xl font-black text-slate-800 tracking-tighter">{{ stats.pending }}</h3>
            </div>
        </div>
        
        <div class="flex items-center gap-2 mt-4">
            <span class="flex h-2 w-2 rounded-full bg-amber-500 animate-ping"></span>
            <span class="text-[10px] font-bold text-amber-600 uppercase">Attention Required</span>
        </div>
    </div>

    <div class="group relative overflow-hidden glass p-8 min-h-[200px] rounded-[2.5rem] border border-white/50 shadow-xl hover:shadow-2xl transition-all duration-500 hover:-translate-y-2 flex flex-col justify-between">
        <div class="absolute -right-6 -top-6 w-32 h-32 rounded-full blur-3xl group-hover:opacity-80 transition-all duration-700 bg-custom-primary/10 group-hover:bg-custom-primary/20"></div>
        
        <div class="relative z-10">
            <div class="flex items-center justify-between mb-8">
                <div class="shadow-lg p-4 rounded-2xl bg-custom-primary shadow-custom-primary/20">
                    <i data-lucide="refresh-cw" class="w-8 h-8 text-white animate-spin-slow"></i>
                </div>
                <span class="text-[11px] font-black px-3 py-1 rounded-full uppercase tracking-widest bg-custom-primary/10 text-custom-primary">Processing</span>
            </div>
            
            <div>
                <p class="text-sm font-bold text-slate-400 uppercase tracking-[0.2em] mb-1">In Progress</p>
                <h3 class="text-5xl font-black text-slate-800 tracking-tighter">{{ stats.in_progress }}</h3>
            </div>
        </div>
        
        <p class="text-[10px] text-slate-400 font-medium mt-4 italic">Allocated to IT Team</p>
    </div>

    <div class="group relative overflow-hidden glass p-8 min-h-[200px] rounded-[2.5rem] border border-white/50 shadow-xl hover:shadow-2xl transition-all duration-500 hover:-translate-y-2 flex flex-col justify-between">
        <div class="absolute -right-6 -top-6 w-32 h-32 bg-emerald-500/10 rounded-full blur-3xl group-hover:bg-emerald-500/20 transition-all duration-700"></div>
        
        <div class="relative z-10">
            <div class="flex items-center justify-between mb-8">
                <div class="bg-emerald-600 shadow-lg shadow-emerald-200 p-4 rounded-2xl transform group-hover:scale-110 transition-transform">
                    <i data-lucide="check-circle" class="w-8 h-8 text-white"></i>
                </div>
                <span class="text-[11px] font-black px-3 py-1 rounded-full bg-emerald-100 text-emerald-700 uppercase tracking-widest">Archived</span>
            </div>
            
            <div>
                <p class="text-sm font-bold text-slate-400 uppercase tracking-[0.2em] mb-1">Completed</p>
                <h3 class="text-5xl font-black text-slate-800 tracking-tighter">{{ stats.completed }}</h3>
            </div>
        </div>
        
        <div class="flex items-center gap-1 text-emerald-600 mt-4">
            <i data-lucide="sparkles" class="w-3 h-3"></i>
            <span class="text-[10px] font-bold uppercase">Efficiency Optimized</span>
        </div>
    </div>
</div>
