<div x-data="{ open: false, query: '', scanning: false, qrReader: null }" @keydown.window.cmd.k.prevent="open = true" @keydown.window.ctrl.k.prevent="open = true" @keydown.escape.window="open = false; $dispatch('close-scan', '')" class="relative">
    <button @click="open = true" class="flex items-center gap-2 px-4 py-2 rounded-xl bg-white/50 border border-gray-200 text-gray-500 hover:bg-white hover:border-gray-300 transition-all">
        <i data-lucide="search" class="w-4 h-4"></i>
        <span class="text-sm hidden md:inline">Search...</span>
        <kbd class="hidden md:inline-flex items-center gap-1 px-2 py-0.5 rounded bg-gray-100 text-xs font-mono text-gray-500">
            <span class="text-xs">⌘</span>K
        </kbd>
    </button>

    <div x-show="open" x-cloak @click.away="open = false; $dispatch('close-scan', '')" class="fixed inset-0 z-50 overflow-y-auto" role="dialog" aria-modal="true">
        <div class="fixed inset-0 bg-black/50 backdrop-blur-sm" @click="open = false; $dispatch('close-scan', '')"></div>
        
        <div class="relative min-h-screen flex items-start justify-center p-4 pt-[10vh]">
            <div x-show="open" x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100" class="relative w-full max-w-2xl bg-white rounded-2xl shadow-2xl overflow-hidden">
                <div class="flex items-center gap-3 p-4 border-b border-gray-100">
                    <i data-lucide="search" class="w-5 h-5 text-gray-400"></i>
                    <input 
                        type="text" 
                        x-model="query"
                        placeholder="Search equipment, requests, vendors, brands, categories..." 
                        class="flex-1 outline-none text-lg placeholder-gray-400"
                        @input="$fetchResults(query)"
                    >
                    <button @click="scanning = !scanning; $dispatch('toggle-scan', scanning)" class="p-2 hover:bg-gray-100 rounded-lg transition-colors" title="Scan QR Code">
                        <i data-lucide="scan-line" class="w-5 h-5" :class="scanning ? 'text-blue-500' : 'text-gray-400'"></i>
                    </button>
                    <button @click="open = false; $dispatch('close-scan', '')" class="p-1 hover:bg-gray-100 rounded-lg transition-colors">
                        <kbd class="px-2 py-1 rounded bg-gray-100 text-xs font-mono text-gray-500">ESC</kbd>
                    </button>
                </div>

                <div x-show="scanning" x-cloak class="p-4 border-b border-gray-100 bg-gray-50">
                    <div id="qr-reader" class="w-full max-w-sm mx-auto"></div>
                    <p class="text-center text-sm text-gray-500 mt-2">Point camera at QR code to scan</p>
                </div>
                
                <div x-show="query.length > 2" class="max-h-96 overflow-y-auto" id="search-results">
                    <div x-data="{ loading: false, results: [] }" x-init="
                        $watch('query', async (value) => {
                            if (value.length < 2) return;
                            loading = true;
                            try {
                                const response = await fetch(`/api/search/?q=${encodeURIComponent(value)}`);
                                const data = await response.json();
                                results = data.results || [];
                            } catch (e) {
                                console.error(e);
                                results = [];
                            }
                            loading = false;
                        })
                    ">
                        <template x-if="loading">
                            <div class="p-8 text-center">
                                <div class="animate-spin w-8 h-8 border-2 border-gray-200 border-t-gray-600 rounded-full mx-auto"></div>
                                <p class="mt-2 text-gray-500">Searching...</p>
                            </div>
                        </template>
                        
                        <template x-if="!loading && results.length === 0">
                            <div class="p-8 text-center">
                                <i data-lucide="search-x" class="w-12 h-12 mx-auto text-gray-300"></i>
                                <p class="mt-2 text-gray-500">No results found</p>
                            </div>
                        </template>
                        
                        <template x-for="result in results" :key="result.id">
                            <a :href="result.url" class="flex items-center gap-4 p-4 hover:bg-gray-50 border-b border-gray-100 transition-colors">
                                <div class="p-2 rounded-lg" :class="result.icon_bg || 'bg-gray-100'">
                                    <i :data-lucide="result.icon || 'file'" class="w-5 h-5" :class="result.icon_color || 'text-gray-600'"></i>
                                </div>
                                <div class="flex-1">
                                    <p class="font-medium text-gray-900" x-text="result.title"></p>
                                    <p class="text-sm text-gray-500" x-text="result.subtitle"></p>
                                </div>
                                <span class="text-xs px-2 py-1 rounded bg-gray-100 text-gray-600" x-text="result.type"></span>
                            </a>
                        </template>
                    </div>
                </div>
                
                <div x-show="query.length <= 2" class="p-4 border-t border-gray-100 bg-gray-50/50">
                    <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Quick Links</p>
                    <div class="grid grid-cols-2 gap-2">
                        <a href="{% url 'requests:create' %}" class="flex items-center gap-3 p-3 rounded-xl hover:bg-gray-100 transition-colors">
                            <i data-lucide="plus-circle" class="w-5 h-5 text-gray-400"></i>
                            <span class="text-sm font-medium">New Request</span>
                        </a>
                        <a href="{% url 'equipment:equipment_list' %}" class="flex items-center gap-3 p-3 rounded-xl hover:bg-gray-100 transition-colors">
                            <i data-lucide="package" class="w-5 h-5 text-gray-400"></i>
                            <span class="text-sm font-medium">Equipment</span>
                        </a>
                        <a href="{% url 'equipment:vendor_list' %}" class="flex items-center gap-3 p-3 rounded-xl hover:bg-gray-100 transition-colors">
                            <i data-lucide="building" class="w-5 h-5 text-gray-400"></i>
                            <span class="text-sm font-medium">Vendors</span>
                        </a>
                        <a href="{% url 'notifications:list' %}" class="flex items-center gap-3 p-3 rounded-xl hover:bg-gray-100 transition-colors">
                            <i data-lucide="bell" class="w-5 h-5 text-gray-400"></i>
                            <span class="text-sm font-medium">Notifications</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('alpine:initialized', () => {
    const searchContainer = document.querySelector('[x-data*="scanning"]');
    if (!searchContainer) return;

    let html5QrcodeScanner = null;

    window.addEventListener('toggle-scan', function(e) {
        if (e.detail === true) {
            startQRScanner();
        } else {
            stopQRScanner();
        }
    });

    window.addEventListener('close-scan', function() {
        stopQRScanner();
    });

    function startQRScanner() {
        if (html5QrcodeScanner) return;

        html5QrcodeScanner = new Html5QrcodeScanner(
            "qr-reader",
            { fps: 10, qrbox: { width: 250, height: 250 } },
            false
        );

        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }

    function stopQRScanner() {
        if (html5QrcodeScanner) {
            html5QrcodeScanner.clear().catch(err => console.error(err));
            html5QrcodeScanner = null;
        }
    }

    function onScanSuccess(decodedText, decodedResult) {
        console.log('QR Code scanned:', decodedText);
        
        const searchInput = document.querySelector('input[placeholder*="Search"]');
        if (searchInput) {
            searchInput.value = decodedText;
            
            const alpineComponent = Alpine.$data(document.querySelector('[x-data*="query"]'));
            if (alpineComponent && alpineComponent.$fetchResults) {
                alpineComponent.query = decodedText;
                alpineComponent.$fetchResults(decodedText);
            }
        }

        stopQRScanner();
        
        const scanningButton = document.querySelector('[title="Scan QR Code"]');
        if (scanningButton) {
            scanningButton.click();
        }
    }

    function onScanFailure(error) {
        // Handle scan failure if needed
    }
});
</script>
