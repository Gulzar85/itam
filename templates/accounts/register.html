<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | {{ business_info.name|default:"IT Asset Manager" }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background: radial-gradient(circle at top left, #f1f5f9 0%, #cbd5e1 100%);
        }
        
        .glass-container { 
            background: rgba(255, 255, 255, 0.7); 
            backdrop-filter: blur(16px) saturate(180%); 
            -webkit-backdrop-filter: blur(16px) saturate(180%); 
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        
        .input-focus:focus { 
            box-shadow: 0 0 0 4px {{ business_info.primary_color|default:"#2563eb" }}20;
            border-color: {{ business_info.primary_color|default:"#2563eb" }};
        }
        
        .transition-all {
            transition-property: all;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
            transition-duration: 300ms;
        }
        
        .error-message {
            animation: shake 0.5s ease-in-out;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-sm border border-slate-100 p-8 md:p-10">
        
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-[1.5rem] shadow-lg mb-6 transform -rotate-6 transition-all" style="background-color: var(--primary-color, {{ business_info.primary_color|default:'#2563eb' }}); box-shadow: 0 10px 15px -3px {{ business_info.primary_color|default:'#2563eb' }}33;">
                <i data-lucide="user-plus" class="w-10 h-10 text-white"></i>
            </div>
            <h1 class="text-3xl font-black text-slate-800 tracking-tight">Create Account</h1>
            <p class="text-slate-500 font-medium mt-2">Join {{ business_info.name|default:"IT Asset Management" }}</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="mb-6 p-4 rounded-2xl {% if message.tags == 'error' %}bg-red-50 border border-red-200 text-red-700{% else %}bg-yellow-50 border border-yellow-200 text-yellow-700{% endif %} error-message">
                    <div class="flex items-center gap-2">
                        <i data-lucide="alert-circle" class="w-5 h-5 flex-shrink-0"></i>
                        <span class="text-sm font-medium">{{ message }}</span>
                    </div>
                </div>
            {% endfor %}
        {% endif %}

        <form action="{% url 'accounts:register' %}" method="POST" class="space-y-6">
            {% csrf_token %}
            
            <div class="grid grid-cols-2 gap-4">
                <div class="space-y-2">
                    <label class="text-xs font-black uppercase tracking-widest text-slate-400 ml-1">First Name</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i data-lucide="user" class="w-5 h-5 text-slate-400 group-focus-within:text-custom-primary transition-colors"></i>
                        </div>
                        <input type="text" name="first_name" required 
                            class="w-full pl-12 pr-4 py-4 bg-white border border-slate-200 rounded-2xl outline-none transition-all input-focus text-slate-700 placeholder:text-slate-300 font-medium" 
                            placeholder="John"
                            value="{{ request.POST.first_name|default:'' }}">
                    </div>
                </div>
                
                <div class="space-y-2">
                    <label class="text-xs font-black uppercase tracking-widest text-slate-400 ml-1">Last Name</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <i data-lucide="user" class="w-5 h-5 text-slate-400 group-focus-within:text-custom-primary transition-colors"></i>
                        </div>
                        <input type="text" name="last_name" required 
                            class="w-full pl-12 pr-4 py-4 bg-white border border-slate-200 rounded-2xl outline-none transition-all input-focus text-slate-700 placeholder:text-slate-300 font-medium" 
                            placeholder="Doe"
                            value="{{ request.POST.last_name|default:'' }}">
                    </div>
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-xs font-black uppercase tracking-widest text-slate-400 ml-1">Username</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i data-lucide="at-sign" class="w-5 h-5 text-slate-400 group-focus-within:text-custom-primary transition-colors"></i>
                    </div>
                    <input type="text" name="username" required 
                        class="w-full pl-12 pr-4 py-4 bg-white border border-slate-200 rounded-2xl outline-none transition-all input-focus text-slate-700 placeholder:text-slate-300 font-medium" 
                        placeholder="john_doe"
                        value="{{ request.POST.username|default:'' }}">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-xs font-black uppercase tracking-widest text-slate-400 ml-1">Email Address</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i data-lucide="mail" class="w-5 h-5 text-slate-400 group-focus-within:text-custom-primary transition-colors"></i>
                    </div>
                    <input type="email" name="email" required 
                        class="w-full pl-12 pr-4 py-4 bg-white border border-slate-200 rounded-2xl outline-none transition-all input-focus text-slate-700 placeholder:text-slate-300 font-medium" 
                        placeholder="john.doe@company.com"
                        value="{{ request.POST.email|default:'' }}">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-xs font-black uppercase tracking-widest text-slate-400 ml-1">Password</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i data-lucide="lock" class="w-5 h-5 text-slate-400 group-focus-within:text-custom-primary transition-colors"></i>
                    </div>
                    <input type="password" name="password1" required 
                        class="w-full pl-12 pr-4 py-4 bg-white border border-slate-200 rounded-2xl outline-none transition-all input-focus text-slate-700 placeholder:text-slate-300 font-medium" 
                        placeholder="••••••••">
                </div>
            </div>

            <div class="space-y-2">
                <label class="text-xs font-black uppercase tracking-widest text-slate-400 ml-1">Confirm Password</label>
                <div class="relative group">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <i data-lucide="lock" class="w-5 h-5 text-slate-400 group-focus-within:text-custom-primary transition-colors"></i>
                    </div>
                    <input type="password" name="password2" required 
                        class="w-full pl-12 pr-4 py-4 bg-white border border-slate-200 rounded-2xl outline-none transition-all input-focus text-slate-700 placeholder:text-slate-300 font-medium" 
                        placeholder="••••••••">
                </div>
            </div>

            <button type="submit" 
                class="w-full py-4 text-white rounded-2xl font-bold text-lg shadow-xl transition-all duration-300 hover:-translate-y-1 active:scale-[0.98] flex items-center justify-center gap-3 group"
                style="background-color: var(--primary-color, {{ business_info.primary_color|default:'#2563eb' }}); box-shadow: 0 10px 15px -3px {{ business_info.primary_color|default:'#2563eb' }}33;">
                <span>Create Account</span>
                <i data-lucide="user-plus" class="w-5 h-5 group-hover:translate-x-1 transition-transform"></i>
            </button>
        </form>

        <div class="mt-10 pt-8 border-t border-slate-200/50 text-center">
            <p class="text-sm text-slate-500">
                Already have an account? 
                <a href="{% url 'accounts:login' %}" class="font-semibold transition-colors" style="color: var(--primary-color, {{ business_info.primary_color|default:'#2563eb' }});">Sign in here</a>
            </p>
        </div>
    </div>

    <script>
        lucide.createIcons();
        
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    input.parentElement.classList.add('ring-2', 'ring-blue-100');
                });
                input.addEventListener('blur', () => {
                    input.parentElement.classList.remove('ring-2', 'ring-blue-100');
                });
            });
        });
    </script>
</body>
</html>
